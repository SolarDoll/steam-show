<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found · Steam Show</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#0b0712">
<meta name="color-scheme" content="dark">
<meta name="darkreader-lock">
<!-- иконки: 32/16 для вкладки, 180 для домашнего экрана iOS,
     манифест для Android (иконки собраны из logo.png на фоне сайта) -->
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/img/icon-16.png">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="stylesheet" href="/assets/css/fonts.css">
<!-- Автономная страница: свои стили, без site.css/JS — она должна открыться
     даже если что-то на сайте сломано. GitHub Pages отдаёт её на любой
     несуществующий адрес, в том числе вложенный (/foo/bar), поэтому пути
     здесь — от корня домена, а не относительные, как на остальных страницах. -->
<style>
  :root{--bg:#0b0712;--ink:#f5eff7;--muted:#a99fb4;--accent:#FF6A1F;--accent2:#FF2E84;
    --display:'Anton',system-ui,sans-serif;--body:'Manrope',system-ui,sans-serif}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);
    display:grid;place-items:center;padding:40px 24px;text-align:center;
    -webkit-font-smoothing:antialiased;
    background-image:radial-gradient(60% 50% at 50% 0%,rgba(255,106,31,.16),transparent 70%)}
  a{color:inherit;text-decoration:none}
  .logo{height:56px;margin:0 auto 28px;display:block}
  .code{font-family:var(--display);font-size:clamp(72px,18vw,180px);line-height:.85;
    margin:0;letter-spacing:.02em;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  h1{font-family:var(--display);font-weight:400;text-transform:uppercase;
    font-size:clamp(22px,4vw,38px);line-height:1;margin:18px 0 0;letter-spacing:.01em}
  p{color:var(--muted);font-size:16px;max-width:44ch;margin:16px auto 32px}
  .home{display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:13px;
    letter-spacing:.1em;text-transform:uppercase;padding:15px 30px;border-radius:100px;
    background:var(--accent);color:#160b06;transition:.25s}
  .home:hover{transform:translateY(-2px);box-shadow:0 14px 34px -12px var(--accent)}
  .shows{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:34px 0 0;padding:0;list-style:none}
  .shows a{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;padding:9px 16px;
    border-radius:100px;border:1px solid rgba(255,255,255,.14);color:var(--muted);transition:.25s}
  .shows a:hover{color:var(--ink);border-color:var(--accent)}
</style>
</head>
<body>
<main>
  <img class="logo" src="/assets/img/logo.png" alt="Steam Show">
  <p class="code">404</p>
  <h1>This stage is empty</h1>
  <p>The page you were looking for doesn't exist. The shows, though, are still on.</p>
  <a class="home" href="/">Back to Steam Show</a>
  <ul class="shows">
    <li><a href="/dragon-fire-show/">Dragon Fire Show</a></li>
    <li><a href="/fire-show/">Fire Show</a></li>
    <li><a href="/led-fire-show/">LED Fire Show</a></li>
    <li><a href="/led-show/">LED Show</a></li>
    <li><a href="/stilt-walkers/">Stilt Walkers</a></li>
  </ul>
</main>
</body>
</html>
